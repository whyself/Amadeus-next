packages:
  - packages/*

# pnpm refuses dependency install scripts unless they are listed here. lefthook's script installs the git hooks below.
allowBuilds:
  esbuild: true
  lefthook: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-include@1.0.11-alpha.2'
  - '@deepseek-ai/cordis-plugin-loader@1.0.7-alpha.2'
  - '@deepseek-ai/cordis@4.0.6-alpha.2'
  - '@deepseek-ai/cosmokit@1.8.7-alpha.2'
  - '@deepseek-ai/schemastery@3.18.6-alpha.2'
  - '@deepseek-ai/dsh-client-locale@0.2.2-alpha.3'
  - '@deepseek-ai/dsh-client-shortcuts@0.2.2-alpha.3'
  - '@deepseek-ai/dsh-client-ui-sidebar-right@0.2.2-alpha.3'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.2-alpha.3'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-alpha.3'
  - '@deepseek-ai/dsh-util-values@0.2.2-alpha.3'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.2-alpha.3'
